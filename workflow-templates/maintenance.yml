name: Maintenance

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dependency-update:
    name: Check Dependencies
    runs-on: windows-latest
    timeout-minutes: 15
    
    steps:
    - name: 📦 Checkout
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-maintenance-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-nuget-maintenance-
          ${{ runner.os }}-nuget-

    - name: 📊 Check for outdated packages
      run: |
        echo "### 📦 Outdated Packages Report" > outdated-report.md
        echo "" >> outdated-report.md
        dotnet list package --outdated >> outdated-report.md

    - name: 📤 Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: outdated-packages-report
        path: outdated-report.md
        retention-days: 30

  cache-cleanup:
    name: Clean Old Caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    
    steps:
    - name: 🧹 Clean old caches
      uses: actions/github-script@v7
      with:
        script: |
          const caches = await github.rest.actions.getActionsCacheList({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const oldCaches = caches.data.actions_caches.filter(cache => {
            const age = Date.now() - new Date(cache.created_at).getTime();
            const dayInMs = 24 * 60 * 60 * 1000;
            return age > (7 * dayInMs); // More than 7 days
          });
          
          for (const cache of oldCaches) {
            await github.rest.actions.deleteActionsCacheById({
              owner: context.repo.owner,
              repo: context.repo.repo,
              cache_id: cache.id,
            });
            console.log(`Deleted cache: ${cache.key}`);
          }

  stale-issues:
    name: Mark Stale Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    
    steps:
    - name: 🏷️ Mark stale issues and PRs
      uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue appears to be inactive. It will be closed in 7 days if no activity is detected.'
        stale-pr-message: 'This PR appears to be inactive. It will be closed in 7 days if no activity is detected.'
        days-before-stale: 60
        days-before-close: 7
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
